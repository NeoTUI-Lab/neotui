[package]
name = "neotui-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "neotui"
path = "src/main.rs"

[dependencies]
neotui-core = { path = "../neotui-core", features = ["http"] }
neotui-gui = { path = "../neotui-gui" }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
tracing = "0.1"
