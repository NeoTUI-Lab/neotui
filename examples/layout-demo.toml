schema_version = "0.1"
theme = "minimal"

[root]
kind = "VBox"
id = "layout-demo"

[root.props]
gap = 1
align = "center"

[[root.children]]
kind = "Label"
id = "header"

[root.children.props]
text = "Layout Demo"
align = "center"
width = 10
height = 1

[[root.children]]
kind = "HBox"
id = "columns"

[root.children.props]
gap = 2
justify = "center"
align = "end"

[[root.children.children]]
kind = "Label"
id = "left-column"

[root.children.children.props]
text = "Left"
align = "center"
width = 4
height = 1

[[root.children.children]]
kind = "Label"
id = "right-column"

[root.children.children.props]
text = "Right"
align = "center"
width = 4
height = 1
