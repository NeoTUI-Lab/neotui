[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "neotui"
version = "0.1.0"
description = "Python bindings and package entrypoint for the NeoTUI framework"
readme = "README.md"
requires-python = ">=3.8"

[tool.maturin]
python-source = "src"
module-name = "neotui._native"
