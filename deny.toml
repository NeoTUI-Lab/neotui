# cargo-deny configuration for NeoTUI.
#
# Security advisories, banned crates and source provenance are hard gates in CI.
# License checking runs as an informational gate while the project license is
# still a placeholder (see crates/neotui-cli/Cargo.toml).
#
# Run locally with:
#   cargo install cargo-deny --locked
#   cargo deny check

[advisories]
version = 2
# Fail on any known security vulnerability in the dependency tree.
# Add RUSTSEC ids here (with a justification comment) only as a temporary,
# reviewed exception.
ignore = []

[bans]
# Duplicate versions are a warning rather than a hard failure: the GTK/VTE stack
# legitimately pulls in several transitive crates with overlapping versions.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses expected across the dependency tree, plus the project's
# own placeholder. Tighten this once the real project license is chosen.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "LicenseRef-Proprietary",
]
