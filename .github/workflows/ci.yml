name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Install Linux GUI dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libgtk-4-dev libvte-2.91-gtk4-dev

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace -- -D warnings

    - name: Run tests
      run: cargo test --workspace

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Python package tests
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest tomli
        bash scripts/test-python.sh

    - name: Build Python native extension
      run: bash scripts/test-python.sh --native

    - name: Build
      run: cargo build --workspace --release

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    - name: Check advisories, bans and sources (hard gate)
      run: cargo deny check advisories bans sources

    - name: Check licenses (informational until the project license is chosen)
      run: cargo deny check licenses
      continue-on-error: true

  package-deb:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Install Linux GUI dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libgtk-4-dev libvte-2.91-gtk4-dev

    - name: Build Debian package
      run: bash scripts/package-deb.sh

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: neotui-deb
        path: target/debian/*.deb
        if-no-files-found: error
